# MemKeep++ configuration
#
# Edit this file. ZRAM changes require reboot; others can be applied via apply.sh.

# Enable zram rebuild at boot: true / false
ZRAM_ENABLE=true

# Zram size.
# Supported values:
#   auto      = 100% of RAM, capped between 8G and 16G
#   8G/12G/16G = fixed size
#   50%/75%/100%/125% = percentage of physical RAM
ZRAM_SIZE=auto

# Compression algorithm.
# Supported values:
#   auto = choose the first supported algorithm from zstd/lz4/lzo-rle/lzo
#   zstd/lz4/lzo-rle/lzo = fixed algorithm
ZRAM_ALGORITHM=auto

# Optional backing device preservation: true / false
# If your current zram has a backing device, this keeps it after rebuilding.
ZRAM_KEEP_BACKING_DEV=true

# Background app retention mode:
#   balanced = safer default, moderate retention
#   strong   = stronger retention for daily multitasking
#   max      = aggressive retention, may increase battery use and delayed cleanup
KEEP_MODE=strong

# Re-apply important settings after boot settles: true / false
LATE_REAPPLY=true

# Keep-alive guardian: true / false
# 保活名单写在 keep_apps.conf。系统的 ActivityManager 会在应用切前后台时
# 重写 oom_score_adj，所以只靠开机压一次是不够的 —— 守护会定期把名单里
# 应用的分数压回去。关掉后名单只在开机时生效一次。
KEEP_DAEMON=true
