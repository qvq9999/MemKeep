# MemKeep++ configuration
#
# Edit this file. ZRAM changes require reboot; others can be applied via apply.sh.

# Enable zram rebuild at boot: true / false
ZRAM_ENABLE=true

# Zram size.
# Supported values:
#   auto      = 100% of RAM, capped between 8G and 16G
#   <N>G      = fixed size, N 为 1–32 的整数（WebUI 提供 8G/12G/16G 预设与自定义）
#   50%–200%  = percentage of physical RAM（老写法，仍兼容）
# 注意 disksize 只是上限，不会立即占用内存；超过物理内存时压缩页会被频繁换出。
ZRAM_SIZE=auto

# Compression algorithm.
# Supported values:
#   auto = choose the first supported algorithm from zstd/lz4/lzo-rle/lzo
#   其余值以 /sys/block/zram0/comp_algorithm 里实际出现过的为准
ZRAM_ALGORITHM=auto

# Optional backing device preservation: true / false
# If your current zram has a backing device, this keeps it after rebuilding.
ZRAM_KEEP_BACKING_DEV=true

# Background app retention mode:
#   balanced = 原厂值附近，功耗优先
#   strong   = 日常多开推荐
#   max      = 极限留存，功耗与偶发卡顿风险上升
#
# 三档不是三组硬编码数字，而是「原厂值 + 偏移」：
#   swappiness            90 / 110 / 130（zram < 1.5×RAM 时 130 自动退回 110）
#   watermark_scale_factor 100 / 125 / 150（值越大越早回收，越不容易被杀）
#   min_free_kbytes       RAM/512 / RAM/256 / RAM/192（钳制 32–160 MB）
#   compaction            10 / 25 / 40
#   dirty_ratio           三档固定 20（与留存无关，不再分层）
#   max_cached_processes  原厂 / ×1.5 / ×2（上限 1024）
#   min_cached_processes  max_cached 的一半（保底，防止缓存被清空）
#   lmkd psi 阈值         原厂 / ×1.3 / ×1.8（越强越晚动手）
#   mglru min_ttl_ms      0 / 1000 / 2000（最近 N 毫秒访问过的页不淘汰）
#
# 在 WebUI 里手动改过「高级设置」后，这一项会被 VM_CUSTOM 覆盖
KEEP_MODE=strong

# Re-apply important settings after boot settles: true / false
LATE_REAPPLY=true

# Keep-alive guardian: true / false
# 保活名单写在 keep_apps.conf。系统的 ActivityManager 会在应用切前后台时
# 重写 oom_score_adj，所以只靠开机压一次是不够的 —— 守护会定期把名单里
# 应用的分数压回去。关掉后名单只在开机时生效一次。
KEEP_DAEMON=true

# 以下键由 WebUI 的「高级设置」写入；不写时跟随 KEEP_MODE 的档位预设。
# VM_CUSTOM=true
# AM_CACHE_MAX=256
# VM_SWAPPINESS=100
# VM_WATERMARK=90
# VM_MIN_FREE=65536
# VM_PAGE_CLUSTER=0
# VM_DIRTY_RATIO=20
# VM_COMPACT=25
# VM_MIN_TTL=1000
VM_CUSTOM=false
AM_CACHE_MAX=0
VM_SWAPPINESS=110
VM_WATERMARK=125
VM_MIN_FREE=65536
VM_PAGE_CLUSTER=0
VM_DIRTY_RATIO=20
VM_COMPACT=25
VM_MIN_TTL=1000
