name: Release

# 用法：改好 module/module.prop 的 version 与 versionCode → 提交到 main → 打 tag 推上去
#   git tag v2.2.0 && git push origin v2.2.0
#
# 流水线顺序（顺序很重要）：
#   1. 打包 ZIP
#   2. 把 ZIP 提交到 main 的 release/ 目录，并重写 update.json
#      —— 必须先提交，jsDelivr 才能从这个路径取到包
#   3. 建 GitHub Release（作为存档，也方便有代理的用户）
#   4. purge jsDelivr 上 update.json 的缓存（分支引用默认缓存 12 小时）
#
# 为什么 zipUrl 走 jsDelivr 而不是 Release 直链：
#   github.com/releases/download 在国内经常连不上；jsDelivr 有 Near China 节点且无需备案。
#   ZIP 文件名带版本号 = 每次都是新路径 = 不会命中旧缓存，所以包本身永远是新的。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # 显式检出 main：tag 事件下默认是 detached HEAD，
      # 回写 commit 时 push 到 main 会因为非快进而失败。
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Read version
        id: meta
        run: |
          VERSION=$(grep -m1 '^version=' module/module.prop | cut -d= -f2-)
          CODE=$(grep -m1 '^versionCode=' module/module.prop | cut -d= -f2-)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "zip=MemKeepPlus-$VERSION.zip" >> "$GITHUB_OUTPUT"
          echo "module.prop -> $VERSION ($CODE)"

      - name: Build zip
        run: |
          python3 scripts/build.py --update-json --repo "${{ github.repository }}"
          ls -lh dist/

      - name: Publish to main (release/ + update.json)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          if git diff --cached --quiet; then
            echo "无需提交"
          else
            git commit -m "chore(release): publish ${{ steps.meta.outputs.zip }}"
            git push origin main
          fi

      - name: Extract this version's changelog
        run: |
          # Release 说明只放本版那一段：从 "## <version>" 到下一个 "## " 之前。
          # 之前直接 body_path: CHANGELOG.md，把从 v2.1 开始的全部历史都贴进了每个 Release。
          VERSION="${{ steps.meta.outputs.version }}"
          awk -v hdr="## $VERSION" '
            $0 == hdr { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > RELEASE_BODY.md
          if [ ! -s RELEASE_BODY.md ]; then
            echo "CHANGELOG.md 里没有找到 $VERSION 段落，退回整份文件"
            cp CHANGELOG.md RELEASE_BODY.md
          fi
          echo "--- 本版说明 $(wc -l < RELEASE_BODY.md) 行 ---"
          head -n 12 RELEASE_BODY.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.meta.outputs.version }}
          body_path: RELEASE_BODY.md
          files: dist/${{ steps.meta.outputs.zip }}
          fail_on_unmatched_files: true

      # update.json / CHANGELOG.md 由 GitHub Pages 提供，缓存约 10 分钟，不需要手动清。
      # zip 走 jsDelivr 的 <版本号>.zip，每次都是新路径，同样不会命中旧缓存。
      - name: Wait for Pages
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://${{ github.repository_owner }}.github.io/${GITHUB_REPOSITORY#*/}/update.json" || true)
            echo "attempt $i -> HTTP $code"
            [ "$code" = "200" ] && break
            sleep 12
          done
